[package]
name = "personal-ai-workbench"
version = "0.1.0"
description = "Local-first personal AI knowledge workbench"
authors = ["Hermes"]
edition = "2021"

[lib]
name = "personal_ai_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = [] }
tauri-plugin-opener = "2.5.0"
tauri-plugin-dialog = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"
zip = "2.2"
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
mysql = "26"
sha2 = "0.10"
windows-sys = { version = "0.59", features = ["Win32_Security_Credentials"] }
